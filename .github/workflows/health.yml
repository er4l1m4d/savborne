name: Production health

# Runs every 15 minutes on the default branch and fails the job (GitHub emails
# the repository owner) when the public health contract is not green.
#
# /api/health is 200 only when the database is reachable, its schema_meta
# version matches the deployed build, and both check-in RPCs exist. It exposes
# no player data and needs no secret. Dependency-free on purpose: curl + grep,
# so a broken package lock cannot silence the monitor.
on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

permissions: {}

jobs:
  health:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Probe https://savborne.vercel.app/api/health
        run: |
          set -euo pipefail
          response=$(curl -sS --max-time 30 -w '\n%{http_code}' \
            https://savborne.vercel.app/api/health)
          code=$(printf '%s' "$response" | tail -n 1)
          body=$(printf '%s' "$response" | sed '$d')

          echo "HTTP $code"
          echo "$body"

          if [ "$code" != "200" ]; then
            echo "::error::health endpoint returned HTTP $code"
            exit 1
          fi
          if ! printf '%s' "$body" | grep -q '"ok":true'; then
            echo "::error::health body is not ok:true"
            exit 1
          fi
          if ! printf '%s' "$body" | grep -q '"schemaVersion":"2026-11-10.1"'; then
            echo "::error::schema version mismatch"
            exit 1
          fi
          echo "Health check passed."
